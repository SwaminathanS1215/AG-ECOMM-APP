<section id="app-products-section">
  <app-product-categories page="products" />
  @if (!showLoader){
  <div id="products-list-section">
    @for (product of products; track product.id){
    <app-product-card [productItem]="product" [category]="category"/>
    }
  </div>
  } @else {
  <app-loader />
  }
</section>
